version: "3.9"

services:
  # ============================================
  # Traefik — Proxy Reverso + HTTPS Automático
  # ============================================
  traefik:
    image: traefik:v3.0
    container_name: botjulio_traefik
    command:
      - "--api.insecure=false"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.email=${LETSENCRYPT_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_letsencrypt:/letsencrypt
    restart: unless-stopped

  # ============================================
  # Bot Júlio — FastAPI (App Principal)
  # ============================================
  api:
    build: .
    container_name: botjulio_api
    env_file: .env.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`${API_DOMAIN}`)"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.routers.api.tls.certresolver=letsencrypt"
      # Redirect HTTP → HTTPS
      - "traefik.http.routers.api-http.rule=Host(`${API_DOMAIN}`)"
      - "traefik.http.routers.api-http.entrypoints=web"
      - "traefik.http.routers.api-http.middlewares=redirect-to-https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
      - "traefik.http.services.api.loadbalancer.server.port=8080"

  # ============================================
  # PostgreSQL com extensão pgvector (RAG)
  # ============================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: botjulio_postgres
    env_file: .env.production
    volumes:
      - botjulio_pg_data:/var/lib/postgresql/data
      - ./app/db/migrations/001_initial.sql:/docker-entrypoint-initdb.d/001_initial.sql:ro
      - ./app/db/migrations/002_whatsapp_migration.sql:/docker-entrypoint-initdb.d/002_whatsapp_migration.sql:ro
      - ./app/db/migrations/003_user_types.sql:/docker-entrypoint-initdb.d/003_user_types.sql:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-botjulio}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # Redis (cache, rate-limit, sessões)
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: botjulio_redis
    volumes:
      - botjulio_redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # MongoDB (Armazenamento NoSQL)
  # ============================================
  mongodb:
    image: mongo:6.0
    container_name: botjulio_mongodb
    volumes:
      - botjulio_mongo_data:/data/db
    restart: unless-stopped
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # Evolution API (WhatsApp)
  # ============================================
  evolution:
    image: atendai/evolution-api:v2.2.1
    container_name: botjulio_evolution
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env.production
    environment:
      - SERVER_URL=https://evolution.${API_DOMAIN}
      - CORS_ORIGIN=*
      - CORS_METHODS=POST,GET,PUT,DELETE
      - CORS_CREDENTIALS=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=${DATABASE_URL_EVOLUTION}
      - REDIS_URI=${REDIS_URL_EVOLUTION}
      - REDIS_PREFIX_KEY=evolution
      - GLOBAL_API_KEY=${EVOLUTION_GLOBAL_API_KEY}
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.evolution.rule=Host(`evolution.${API_DOMAIN}`)"
      - "traefik.http.routers.evolution.entrypoints=websecure"
      - "traefik.http.routers.evolution.tls.certresolver=letsencrypt"
      - "traefik.http.services.evolution.loadbalancer.server.port=8080"

volumes:
  botjulio_pg_data:
  botjulio_redis_data:
  botjulio_mongo_data:
  traefik_letsencrypt:

# ============================================================
# NOTAS DE USO
# ============================================================
# Variáveis necessárias no .env.production (NÃO commitar):
#   LETSENCRYPT_EMAIL=seu@email.com
#   API_DOMAIN=api.vidiceo.com.br
#   POSTGRES_USER=postgres
#   POSTGRES_PASSWORD=senha_forte_aqui
#   POSTGRES_DB=botjulio
#   EVOLUTION_GLOBAL_API_KEY=senha_global_evolution
#   DATABASE_URL_EVOLUTION=postgresql://postgres:senha_forte_aqui@postgres:5432/botjulio
#   REDIS_URL_EVOLUTION=redis://redis:6379/2
#   (+ todas as variáveis do .env original)
#
# Para subir em produção:
#   docker-compose -f docker-compose.yml up -d
#
# Para dev local (sem Traefik/HTTPS):
#   docker-compose -f docker-compose.dev.yml up -d
# ============================================================
